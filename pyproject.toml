[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firewarning-agent-worker"
version = "0.1.0"
description = "Fail-closed RunPod worker for FireWarning media analysis"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
managed-cloud = [
  "boto3==1.43.50",
]
azure-maps = [
  "azure-identity==1.25.3",
  "httpx==0.28.1",
]
source-acquisition = [
  "boto3==1.43.50",
  "httpx==0.28.1",
  "pillow==12.3.0",
]
geographic-mvp = [
  "numpy==2.4.6",
  "pyproj==3.7.2",
]
runtime = [
  "accelerate==1.14.0",
  "einops==0.8.2",
  "huggingface-hub==1.24.0",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "numpy==2.4.6",
  "opencv-python-headless==4.13.0.92",
  "runpod==1.10.1",
  "safetensors==0.8.0",
  "transformers==5.14.1",
  "vercel==0.7.0",
]
burned-area-runtime = [
  "pyyaml==6.0.3",
  "rasterio==1.4.4",
  "terratorch==1.2.10",
]
roma-registration = [
  "einops==0.8.2",
  "kornia==0.8.3",
  "numpy==2.4.6",
  "opencv-python-headless==4.13.0.92",
  "psutil==7.2.2",
  "pycolmap==4.1.1",
  "pyproj==3.7.2",
]
localization-mvp = [
  "faiss-cpu==1.15.0",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "tzdata>=2025.2; sys_platform == 'win32'",
]
vision-mvp = [
  "pillow==12.3.0",
  "psutil==7.2.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==4.57.6",
]
video-mvp = [
  "httpx==0.28.1",
  "opencv-python-headless==4.13.0.92",
  "pillow==12.3.0",
]
public-media = [
  "boto3==1.43.50",
  "httpx==0.28.1",
  "opencv-python-headless==4.13.0.92",
  "pillow==12.3.0",
]
satellite-cpu = [
  "boto3==1.43.50",
  "h5py==3.15.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "rasterio==1.4.4",
  "shapely==2.1.2",
]
corpus = [
  "datasets==4.8.5",
  "huggingface-hub==0.36.2",
  "httpx==0.28.1",
  "imagehash==4.3.2",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
]
eo4-conversion = [
  "h5py==3.15.1",
  "huggingface-hub==0.36.2",
  "numpy==2.4.6",
]
spatial-training = [
  "huggingface-hub==0.36.2",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "pyproj==3.7.2",
  "pyyaml==6.0.3",
  "rasterio==1.4.4",
]
spatial-train = [
  "accelerate==1.14.0",
  "peft==0.19.1",
  "psutil==7.2.2",
  "qwen-vl-utils==0.0.14",
  "safetensors==0.8.0",
  "transformers==4.57.6",
]
training = [
  "accelerate==1.14.0",
  "albumentations==2.0.8",
  "datasets==4.8.5",
  "evaluate==0.4.6",
  "huggingface-hub==0.36.2",
  "imagehash==4.3.2",
  "pillow==12.3.0",
  "pycocotools==2.0.10",
  "safetensors==0.8.0",
  "torchmetrics==1.8.2",
  "transformers==4.57.6",
]
detector-benchmark = [
  "torchmetrics==1.8.2",
  "transformers==4.57.6",
  "ultralytics==8.4.106",
]
burned-area-materialization = [
  "h5py==3.15.1",
  "numpy==2.4.6",
  "pyyaml==6.0.3",
  "rasterio==1.4.4",
]
burned-area-training = [
  "h5py==3.15.1",
  "numpy==2.4.6",
  "pyyaml==6.0.3",
  "rasterio==1.4.4",
  "terratorch==1.2.10",
]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.21",
  "mypy==2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firewarning_worker = ["py.typed", "stage_contracts_data/*.json", "mvp_stack_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.uv]
conflicts = [
  [{ extra = "runtime" }, { extra = "vision-mvp" }],
  [{ extra = "runtime" }, { extra = "eo4-conversion" }],
  [{ extra = "runtime" }, { extra = "corpus" }],
  [{ extra = "runtime" }, { extra = "spatial-training" }],
  [{ extra = "runtime" }, { extra = "spatial-train" }],
  [{ extra = "runtime" }, { extra = "training" }],
  [{ extra = "runtime" }, { extra = "detector-benchmark" }],
  [{ extra = "runtime" }, { extra = "burned-area-training" }],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["firewarning_worker"]

[[tool.mypy.overrides]]
module = ["azure.*", "boto3", "boto3.*", "botocore", "botocore.*", "cv2.*", "h5py.*", "huggingface_hub.*", "kornia.*", "numpy.*", "pyproj.*", "rasterio.*", "romatch.*", "shapely.*", "terratorch.*", "torch.*", "torchvision.*", "transformers.*", "PIL.*", "qwen_vl_utils.*", "httpx.*", "runpod.*", "flash_attn.*", "ultralytics.*", "vercel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "firewarning_worker.bootstrap",
  "firewarning_worker.memory_manager",
  "firewarning_worker.research_agent",
]
disable_error_code = ["redundant-cast", "unused-ignore"]
