name: publish-eve-cpu-image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable Git ref to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eve-point-supervisor-cpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fireviewer/fireviewer-eve-point-supervisor-cpu:${{ inputs.source_ref }}
          provenance: true
